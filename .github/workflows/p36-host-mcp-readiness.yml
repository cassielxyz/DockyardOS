name: P36 Host MCP Connection Readiness

on:
  pull_request:
    paths:
      - "src/host-session-readiness.ts"
      - "src/mcp-server.ts"
      - "src/index.ts"
      - "test/p36-host-mcp-readiness.test.mjs"
      - ".github/workflows/p36-host-mcp-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Run P36 deterministic host-session readiness tests
        run: node --test test/p36-host-mcp-readiness.test.mjs
      - name: Verify MCP session readiness remains non-persistent and approval-neutral
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const source = await readFile('src/mcp-server.ts', 'utf8');
          for (const tool of ['dockyard_connection_attest', 'dockyard_fulfillment']) {
            if (!source.includes(`"${tool}"`)) throw new Error(`missing ${tool}`);
          }
          if (!source.includes('const sessionConnections = new HostSessionConnectionRegistry()')) {
            throw new Error('session connection registry must stay process-local to dockyard-mcp');
          }
          if (!source.includes('credentialsStored: false') || !source.includes('grantsMutationApproval: false')) {
            throw new Error('MCP evidence must explicitly remain credential-free and approval-neutral');
          }
          NODE
