name: P39 Autonomous Skills and Cinematic Web

on:
  pull_request:
    paths:
      - "src/skill-bootstrap.ts"
      - "src/skill-command.ts"
      - "src/capability-fulfillment-hook.ts"
      - "src/capability-fulfillment.ts"
      - "src/team-command.ts"
      - "src/selection.ts"
      - "src/capability-inference.ts"
      - "src/catalog-cinematic.ts"
      - "src/bundled-capability-guidance.ts"
      - "src/media-models.ts"
      - "src/cinematic-web.ts"
      - "src/providers-expanded.ts"
      - "src/recipes-creative.ts"
      - "src/hooks.ts"
      - "src/main.ts"
      - "src/index.ts"
      - "integrations/vscode/**"
      - "integrations/portable/skills/**"
      - "test/p39-autonomous-skills-cinematic-web.test.mjs"
      - ".github/workflows/p39-autonomous-skills-cinematic-web.yml"
      - "docs/CINEMATIC_WEB.md"
      - "README.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Core dependencies
        run: npm install --ignore-scripts
      - name: Build Core
        run: npm run build
      - name: Run P39 and compatibility tests
        run: |
          node --test test/p39-autonomous-skills-cinematic-web.test.mjs
          node --test test/p37-connections-creative-ui.test.mjs test/p38-universal-control-center.test.mjs
          node --test test/capability-fulfillment.test.mjs test/team.test.mjs test/core.test.mjs
      - name: Check extension JavaScript
        working-directory: integrations/vscode
        run: |
          npm install --ignore-scripts
          npm run check
      - name: Package and inspect Preview 3 VSIX
        working-directory: integrations/vscode
        run: |
          npm run prepare-core
          npx @vscode/vsce package --out /tmp/dockyardos-0.1.3-preview3.vsix
          test -s /tmp/dockyardos-0.1.3-preview3.vsix
          unzip -p /tmp/dockyardos-0.1.3-preview3.vsix extension/package.json > /tmp/vsix-package.json
          node -e "const p=require('/tmp/vsix-package.json'); if(p.version!=='0.1.3') process.exit(1)"
          unzip -l /tmp/dockyardos-0.1.3-preview3.vsix | grep -q 'extension/core/dist/skill-bootstrap.js'
          unzip -l /tmp/dockyardos-0.1.3-preview3.vsix | grep -q 'extension/core/dist/cinematic-web.js'
          unzip -l /tmp/dockyardos-0.1.3-preview3.vsix | grep -q 'extension/core/dist/media-models.js'
          unzip -l /tmp/dockyardos-0.1.3-preview3.vsix | grep -q 'extension/core/integrations/portable/skills/threejs-r3f-cinematic/SKILL.md'
          unzip -l /tmp/dockyardos-0.1.3-preview3.vsix | grep -q 'extension/core/integrations/portable/skills/frame-sequence-2-5d/SKILL.md'
      - uses: actions/upload-artifact@v4
        with:
          name: dockyardos-0.1.3-preview3-vsix
          path: /tmp/dockyardos-0.1.3-preview3.vsix
          if-no-files-found: error
