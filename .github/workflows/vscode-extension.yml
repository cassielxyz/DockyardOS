name: VS Code Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build DockyardOS Core
        run: |
          npm install --ignore-scripts
          npm test
      - name: Package VSIX with bundled Core
        working-directory: integrations/vscode
        run: |
          npm install --ignore-scripts
          npm run package -- --out dockyardos-vscode.vsix
          test -s dockyardos-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: dockyardos-vscode
          path: integrations/vscode/dockyardos-vscode.vsix
          if-no-files-found: error
