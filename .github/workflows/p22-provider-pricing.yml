name: P22 Provider Pricing Evidence

on:
  pull_request:
    paths:
      - "src/provider-pricing.ts"
      - "src/provider-planner.ts"
      - "src/provider-command.ts"
      - "src/main.ts"
      - "src/index.ts"
      - "test/provider-pricing.test.mjs"
      - ".github/workflows/p22-provider-pricing.yml"
  push:
    branches: [main]
    paths:
      - "src/provider-pricing.ts"
      - "src/provider-planner.ts"
      - "src/provider-command.ts"
      - "src/main.ts"
      - "src/index.ts"
      - "test/provider-pricing.test.mjs"
      - ".github/workflows/p22-provider-pricing.yml"

permissions:
  contents: read

jobs:
  pricing-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: P22 deterministic pricing tests
        run: node --test test/provider-pricing.test.mjs
      - name: Cached pricing CLI remains network-free and fail-closed
        run: |
          export DOCKYARD_HOME="$(mktemp -d)"
          node dist/main.js providers pricing --cached > /tmp/p22-pricing-cache.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/p22-pricing-cache.json','utf8')); if(p.mode!=='cache'||!Array.isArray(p.providers)||p.providers.length!==0) process.exit(1)"
          node dist/main.js providers plan --capability web-hosting --stack web,nextjs --environment preview --free-first --json > /tmp/p22-plan.json
          node - <<'NODE'
          const p=JSON.parse(require('fs').readFileSync('/tmp/p22-plan.json','utf8'));
          if(p.request?.costPreference!=='free-first') process.exit(1);
          if(!Array.isArray(p.pricingEvidence) || p.pricingEvidence.length!==0) process.exit(1);
          if(!p.capabilities?.[0]?.selected?.livePricingCheckRequired) process.exit(1);
          NODE
