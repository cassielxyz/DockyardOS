name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Local MCP and native bridge static checks
        run: |
          test -f dist/mcp-server.js
          grep -q 'dockyard_community_active' dist/mcp-server.js
          grep -q 'dockyard_community_entrypoint' dist/mcp-server.js
          timeout 5s node dist/mcp-server.js </dev/null
          node -e "JSON.parse(require('fs').readFileSync('integrations/native/gemini-cli/gemini-extension.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/native/gemini-cli/hooks/hooks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/native/codex/.codex-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/native/codex/.mcp.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/native/claude-code/.mcp.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/native/cursor/.cursor/mcp.json','utf8'))"
      - name: Community registry static checks
        run: |
          node -e "JSON.parse(require('fs').readFileSync('registry/community.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('registry/publishers.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('registry/remotes.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('registry/registry-keys.json','utf8'))"
          node dist/main.js community list --json
          node dist/main.js community search --query security --json
          node dist/main.js community inspect --id superpowers-core-skills --json
          node dist/main.js community verify --json
          node dist/main.js community transparency verify --json
          node dist/main.js community active --json
          node dist/main.js community remote sources --json
          node dist/main.js community remote cached --json
      - name: P7 signing and canary CLI smoke
        run: |
          export DOCKYARD_HOME="$(mktemp -d)"
          node dist/main.js community publisher keygen --id ci-publisher --key-id ci-publisher-key-1 > /tmp/publisher-key.json
          node dist/main.js community registry-key keygen --id ci-registry --key-id ci-registry-key-1 > /tmp/registry-key.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/publisher-key.json','utf8')); if(!p.publicKeyPem || !p.privateKeyPath || p.privateKeyPem) process.exit(1)"
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/registry-key.json','utf8')); if(!p.publicKeyPem || !p.trustStoreEntry || p.privateKeyPem) process.exit(1)"
          test "$(stat -c '%a' "$DOCKYARD_HOME/signing-keys/publisher/ci-publisher/ci-publisher-key-1.private.pem")" = "600"
          test "$(stat -c '%a' "$DOCKYARD_HOME/signing-keys/registry/ci-registry/ci-registry-key-1.private.pem")" = "600"
      - name: P8 effective registry and safe update CLI smoke
        run: |
          export DOCKYARD_HOME="$(mktemp -d)"
          node dist/main.js community list --json > /tmp/effective-registry.json
          node dist/main.js community sources --json > /tmp/effective-sources.json
          node dist/main.js community updates check --json > /tmp/community-updates.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/effective-registry.json','utf8')); if(!Array.isArray(r.packages) || !Array.isArray(r.conflicts) || !Array.isArray(r.remoteRegistries)) process.exit(1)"
          node -e "const u=JSON.parse(require('fs').readFileSync('/tmp/community-updates.json','utf8')); if(!Array.isArray(u) || u.length) process.exit(1)"
      - name: P9 provider action and preview CLI smoke
        run: |
          node dist/main.js providers actions --provider vercel > /tmp/provider-actions.json
          node dist/main.js providers action plan --provider vercel --action preview-deploy --environment preview --param prebuilt=true > /tmp/vercel-preview-plan.json
          node dist/main.js providers action plan --provider supabase --action preview-branch-create --environment preview --param project-ref=abcdefghijklmnopqrst --param branch=ci-preview > /tmp/supabase-preview-plan.json
          node dist/main.js providers preview plan --database supabase --web vercel --param supabase.project-ref=abcdefghijklmnopqrst --param supabase.branch=ci-preview --param vercel.prebuilt=true > /tmp/preview-environment-plan.json
          node -e "const a=JSON.parse(require('fs').readFileSync('/tmp/provider-actions.json','utf8')); if(!Array.isArray(a) || !a.some(x=>x.actionId==='preview-deploy')) process.exit(1)"
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/preview-environment-plan.json','utf8')); if(p.environment!=='preview' || p.steps.length!==2 || p.steps.some(s=>s.productionApprovalRequired)) process.exit(1)"
          if node dist/main.js providers action run --provider vercel --action production-deploy --environment production --approve >/tmp/should-fail.log 2>&1; then
            echo "production provider action unexpectedly ran without --approve-production"
            exit 1
          fi
      - name: P10 security policy and SARIF CLI smoke
        run: |
          root="$PWD"
          export DOCKYARD_HOME="$(mktemp -d)"
          tmp=$(mktemp -d)
          cd "$tmp"
          node "$root/dist/main.js" init --name security-policy-smoke --mode balanced
          node "$root/dist/main.js" security policy add-secret --id ci-fixture --fingerprint 'fixture.env:1:CI_TOKEN:1' --owner ci-security --rationale 'Known inert CI fixture credential for policy smoke coverage.' --expires 2027-01-15T00:00:00Z > /tmp/p10-policy.json
          export REPO_ROOT="$root"
          RESULT_PATH=$(node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const dockyard = await import(pathToFileURL(`${process.env.REPO_ROOT}/dist/index.js`).href);
          const projectDir = dockyard.projectDirectory(dockyard.projectIdForRoot(process.cwd()));
          const runId = 'ci-policy-run';
          const artifactDirectory = resolve(projectDir, 'security', 'runs', runId);
          await mkdir(artifactDirectory, { recursive: true });
          const result = {
            runId,
            profile: 'general',
            target: { type: 'source', value: '.' },
            status: 'findings',
            steps: [{
              scanner: 'gitleaks',
              status: 'findings',
              exitCode: 1,
              findings: [{ scanner: 'gitleaks', ruleId: 'generic-api-key', title: 'Potential secret detected', severity: 'high', file: 'fixture.env', line: 1, fingerprint: 'fixture.env:1:CI_TOKEN:1' }],
              summary: 'synthetic CI finding',
              startedAt: '2026-09-27T12:00:00.000Z',
              finishedAt: '2026-09-27T12:00:01.000Z'
            }],
            gates: [],
            artifactDirectory,
            startedAt: '2026-09-27T12:00:00.000Z',
            finishedAt: '2026-09-27T12:00:01.000Z'
          };
          const resultPath = resolve(artifactDirectory, 'result.json');
          await writeFile(resultPath, `${JSON.stringify(result, null, 2)}\n`, { mode: 0o600 });
          console.log(resultPath);
          NODE
          )
          node "$root/dist/main.js" security policy evaluate --result "$RESULT_PATH" > /tmp/p10-evaluation.json
          node -e "const e=JSON.parse(require('fs').readFileSync('/tmp/p10-evaluation.json','utf8')); if(e.gate!=='accepted-risk' || e.rawFindingCount!==1 || e.acceptedFindingCount!==1 || e.blockingFindingCount!==0) process.exit(1)"
          node "$root/dist/main.js" security sarif --result "$RESULT_PATH" > /tmp/p10-sarif-export.json
          SARIF_PATH=$(node -e "const e=JSON.parse(require('fs').readFileSync('/tmp/p10-sarif-export.json','utf8')); process.stdout.write(e.path)")
          test -s "$SARIF_PATH"
          node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); const r=s.runs?.[0]?.results?.[0]; if(s.version!=='2.1.0' || !r?.suppressions?.length || r.properties?.dockyardPolicyDisposition!=='accepted-risk') process.exit(1)" "$SARIF_PATH"
      - name: VS Code bridge and bundled Core check
        run: |
          node --check integrations/vscode/extension.js
          node --check integrations/vscode/scripts/prepare-core.cjs
          node integrations/vscode/scripts/prepare-core.cjs
          test -f integrations/vscode/core/dist/main.js
          test -f integrations/vscode/core/dist/mcp-server.js
          test -f integrations/vscode/core/registry/community.json
          test -f integrations/vscode/core/registry/publishers.json
          test -f integrations/vscode/core/registry/remotes.json
          test -f integrations/vscode/core/registry/registry-keys.json
          test -f integrations/vscode/core/integrations/portable/skills/dockyardos/SKILL.md
          test -f integrations/vscode/core/integrations/native/gemini-cli/gemini-extension.json
          test -f integrations/vscode/core/node_modules/@modelcontextprotocol/server/package.json
          node integrations/vscode/core/dist/main.js --help
          node integrations/vscode/core/dist/main.js host list --json
          node integrations/vscode/core/dist/main.js host native-info --host codex --json
          node integrations/vscode/core/dist/main.js community list --json
          node integrations/vscode/core/dist/main.js community active --json
          node integrations/vscode/core/dist/main.js community remote sources --json
          node integrations/vscode/core/dist/main.js community updates check --json
          node integrations/vscode/core/dist/main.js providers actions --provider vercel
          node integrations/vscode/core/dist/main.js providers preview plan --web vercel
          node integrations/vscode/core/dist/main.js security policy show
      - name: Package VS Code extension
        working-directory: integrations/vscode
        run: |
          npm install --ignore-scripts
          npx @vscode/vsce package --out /tmp/dockyardos-vscode.vsix
          test -s /tmp/dockyardos-vscode.vsix
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/community-hub-model.js'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/community-hub-view.js'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/dist/mcp-server.js'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/registry/community.json'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/registry/publishers.json'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/registry/remotes.json'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/registry/registry-keys.json'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/integrations/native/codex/.mcp.json'
          unzip -l /tmp/dockyardos-vscode.vsix | grep -q 'extension/core/node_modules/@modelcontextprotocol/server/package.json'
      - name: CLI smoke test
        run: |
          node dist/main.js --help
          node dist/main.js policy --command "git status" --json
          node dist/main.js plan --profile full --stack nextjs,supabase --security high --json
          node dist/main.js registry verify
          node dist/main.js catalog --category security --json
          node dist/main.js recipes --id saas-web --json
          node dist/main.js recommend --task "Build a production SaaS dashboard" --stack web,nextjs,react,supabase,postgres --security standard --json
          node dist/main.js providers inspect --id vercel,supabase --json
          node dist/main.js providers chain --capability postgres --json
          node dist/main.js providers plan --capability web-hosting,postgres,auth --stack web,nextjs,postgres --environment preview --free-first --json
          node dist/main.js security profiles --json
          node dist/main.js team compose --task "Build a production SaaS dashboard" --stack web,nextjs,react,supabase,postgres --json
          node dist/main.js host list --json
          node dist/main.js host plan --host cursor --scope project --json
          node dist/main.js host plan --host codex --scope runtime --json
          node dist/main.js host native-info --host gemini-cli --json
          node dist/main.js host doctor --host codex --json
          node dist/main.js community sources --json
          node dist/main.js community status --json
          node dist/main.js community active --json
      - name: Security team and host state CLI smoke test
        run: |
          root="$PWD"
          tmp=$(mktemp -d)
          cd "$tmp"
          node "$root/dist/main.js" init --name orchestration-smoke --mode balanced
          node "$root/dist/main.js" security plan --profile web --target . --target-type source --mode quick --json
          node "$root/dist/main.js" security threat-model --profile api --json
          node "$root/dist/main.js" team start --task "Fix the login crash" --stack typescript --json
          node "$root/dist/main.js" team status --json
          node "$root/dist/main.js" team advance --artifact discovery.json --decision "Reproduce before changing code" --json
          node "$root/dist/main.js" team status --json
          node "$root/dist/main.js" host install --host cursor --scope project --json
          node "$root/dist/main.js" host doctor --host cursor --json
          test -f .agents/skills/dockyardos/SKILL.md
