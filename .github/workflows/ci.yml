name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          node dist/cli.js policy --command "git status" --json
          node dist/cli.js plan --profile full --stack nextjs,supabase --security high --json
          node dist/cli.js registry verify
          node dist/cli.js catalog --category security --json
          node dist/cli.js recipes --id saas-web --json
          node dist/cli.js recommend --task "Build a production SaaS dashboard" --stack web,nextjs,react,supabase,postgres --security standard --json
          node dist/cli.js providers inspect --id vercel,supabase --json
          node dist/cli.js providers chain --capability postgres --json
          node dist/cli.js providers plan --capability web-hosting,postgres,auth --stack web,nextjs,postgres --environment preview --free-first --json
