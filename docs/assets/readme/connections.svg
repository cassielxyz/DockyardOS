<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">DockyardOS Connections Center</title><desc id="desc">Provider and MCP readiness cards with conservative connected-state semantics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#f0f6fc" font-size="30" font-weight="700">Connections Center — readiness without becoming a secret vault</text><text x="60" y="98" fill="#8b949e" font-size="16">Local detection first. Read-only live verification on demand. External mutations remain separately approval-gated.</text><g transform="translate(60 140)"><rect width="1080" height="335" rx="18" fill="#0f141b" stroke="#30363d"/><rect width="1080" height="46" rx="18" fill="#161b22"/><text x="22" y="29" fill="#f0f6fc" font-size="15" font-weight="650">DockyardOS: Connections</text><rect x="815" y="10" width="112" height="26" rx="7" fill="#21262d"/><text x="871" y="28" text-anchor="middle" fill="#c9d1d9" font-size="11">Refresh local</text><rect x="938" y="10" width="120" height="26" rx="7" fill="#1f6feb"/><text x="998" y="28" text-anchor="middle" fill="#fff" font-size="11">Verify connections</text><g transform="translate(22 70)"><rect width="322" height="105" rx="12" fill="#161b22" stroke="#30363d"/><text x="16" y="25" fill="#f0f6fc" font-size="15" font-weight="650">GitHub</text><text x="16" y="47" fill="#8b949e" font-size="11">provider account</text><rect x="231" y="14" width="75" height="24" rx="12" fill="none" stroke="#3fb950"/><text x="268" y="30" text-anchor="middle" fill="#7ee787" font-size="10">Ready</text><text x="16" y="72" fill="#c9d1d9" font-size="11">CLI installed · authenticated</text><text x="16" y="91" fill="#79c0ff" font-size="10">live checked · read-only</text><rect x="365" width="322" height="105" rx="12" fill="#161b22" stroke="#30363d"/><text x="381" y="25" fill="#f0f6fc" font-size="15" font-weight="650">Supabase</text><text x="381" y="47" fill="#8b949e" font-size="11">provider account</text><rect x="572" y="14" width="99" height="24" rx="12" fill="none" stroke="#d29922"/><text x="621" y="30" text-anchor="middle" fill="#e3b341" font-size="10">Needs login</text><text x="381" y="72" fill="#c9d1d9" font-size="11">CLI installed · not authenticated</text><text x="381" y="91" fill="#8b949e" font-size="10">login opens provider CLI</text><rect x="730" width="306" height="105" rx="12" fill="#161b22" stroke="#30363d"/><text x="746" y="25" fill="#f0f6fc" font-size="15" font-weight="650">Inspo MCP</text><text x="746" y="47" fill="#8b949e" font-size="11">design-reference connector</text><rect x="933" y="14" width="87" height="24" rx="12" fill="none" stroke="#58a6ff"/><text x="976" y="30" text-anchor="middle" fill="#79c0ff" font-size="10">No auth</text><text x="746" y="72" fill="#c9d1d9" font-size="11">endpoint available · setup ready</text><text x="746" y="91" fill="#8b949e" font-size="10">not called connected until host verifies</text><rect y="130" width="505" height="115" rx="12" fill="#111827" stroke="#30363d"/><text x="18" y="157" fill="#79c0ff" font-size="11">PROVIDER TRUTH</text><text x="18" y="185" fill="#f0f6fc" font-size="16" font-weight="650">configured ≠ authenticated ≠ linked</text><text x="18" y="208" fill="#8b949e" font-size="11">Dockyard checks the level a capability actually requires.</text><text x="18" y="229" fill="#8b949e" font-size="11">A green card still does not grant mutation approval.</text><rect x="531" y="130" width="505" height="115" rx="12" fill="#111827" stroke="#30363d"/><text x="549" y="157" fill="#a78bfa" font-size="11">MCP TRUTH</text><text x="549" y="185" fill="#f0f6fc" font-size="16" font-weight="650">configured ≠ connected in this host session</text><text x="549" y="208" fill="#8b949e" font-size="11">Current-session evidence expires with the bridge process.</text><text x="549" y="229" fill="#8b949e" font-size="11">No tokens or connector credentials enter checkpoints.</text></g></g><rect x="270" y="505" width="660" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="600" y="524" text-anchor="middle" fill="#c9d1d9" font-size="11">GitHub • Vercel • Cloudflare • Supabase • Neon • Firebase • Figma • Linear • Notion • Sentry • Inspo • more</text></g></svg>