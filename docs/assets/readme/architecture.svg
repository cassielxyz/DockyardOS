<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">DockyardOS architecture</title><desc id="desc">How a user request moves through DockyardOS planning, memory, capability selection, host execution, verification and checkpointing.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#4cc9f0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#58a6ff"/></marker></defs><rect width="1200" height="640" rx="28" fill="url(#bg)"/><text x="60" y="70" fill="#f0f6fc" font-size="30" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">How DockyardOS sits between you and the coding agent</text><text x="60" y="102" fill="#8b949e" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">It does not replace the model. It gives the model durable project state, bounded tools, workflow and proof.</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="60" y="155" width="200" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="82" y="187" fill="#8b949e" font-size="12">1 · INTENT</text><text x="82" y="218" fill="#f0f6fc" font-size="20" font-weight="650">Your request</text><text x="82" y="243" fill="#c9d1d9" font-size="13">natural language</text><rect x="330" y="155" width="250" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="352" y="187" fill="#8b949e" font-size="12">2 · ORCHESTRATION</text><text x="352" y="218" fill="#f0f6fc" font-size="20" font-weight="650">Classify + plan</text><text x="352" y="243" fill="#c9d1d9" font-size="13">task · stack · risk · phase</text><rect x="650" y="155" width="250" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="672" y="187" fill="#8b949e" font-size="12">3 · CAPABILITY ROUTING</text><text x="672" y="218" fill="#f0f6fc" font-size="20" font-weight="650">Select the minimum set</text><text x="672" y="243" fill="#c9d1d9" font-size="13">skills · agents · MCPs · providers</text><rect x="970" y="155" width="170" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="992" y="187" fill="#8b949e" font-size="12">4 · HOST</text><text x="992" y="218" fill="#f0f6fc" font-size="20" font-weight="650">Execute</text><text x="992" y="243" fill="#c9d1d9" font-size="13">Antigravity + others</text><path d="M260 208h58M580 208h58M900 208h58" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="120" y="350" width="270" height="165" rx="18" fill="#111827" stroke="#30363d"/><text x="144" y="383" fill="#79c0ff" font-size="12">PERSISTENT PROJECT BRAIN</text><text x="144" y="415" fill="#f0f6fc" font-size="19" font-weight="650">External memory</text><text x="144" y="444" fill="#c9d1d9" font-size="13">• checkpoints and resume context</text><text x="144" y="469" fill="#c9d1d9" font-size="13">• decisions, blockers, artifacts</text><text x="144" y="494" fill="#c9d1d9" font-size="13">• team / phase / Git evidence</text><rect x="465" y="350" width="270" height="165" rx="18" fill="#111827" stroke="#30363d"/><text x="489" y="383" fill="#a78bfa" font-size="12">POLICY + READINESS</text><text x="489" y="415" fill="#f0f6fc" font-size="19" font-weight="650">Truth before action</text><text x="489" y="444" fill="#c9d1d9" font-size="13">• selected ≠ installed ≠ connected</text><text x="489" y="469" fill="#c9d1d9" font-size="13">• approval gates for mutations</text><text x="489" y="494" fill="#c9d1d9" font-size="13">• provider / MCP verification</text><rect x="810" y="350" width="270" height="165" rx="18" fill="#111827" stroke="#30363d"/><text x="834" y="383" fill="#7ee787" font-size="12">INDEPENDENT VERIFICATION</text><text x="834" y="415" fill="#f0f6fc" font-size="19" font-weight="650">Prove the result</text><text x="834" y="444" fill="#c9d1d9" font-size="13">• tests and browser inspection</text><text x="834" y="469" fill="#c9d1d9" font-size="13">• security scan and rerun</text><text x="834" y="494" fill="#c9d1d9" font-size="13">• checkpoint verified evidence</text><path d="M455 260v58h-200v20M775 260v58h-175v20M1055 260v58h-110v20" stroke="#30363d" stroke-width="2" fill="none"/><path d="M390 432h63M735 432h63" stroke="url(#line)" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="560" width="580" height="44" rx="12" fill="#161b22" stroke="#30363d"/><text x="600" y="588" fill="#c9d1d9" font-size="14" text-anchor="middle">Every meaningful mutation can end with evidence → checkpoint → resumable state</text></g></svg>