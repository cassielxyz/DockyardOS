<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">DockyardOS creative UI stack</title><desc id="desc">Creative web UI orchestration using real inspiration, design skills, implementation guidance and browser verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#171126"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#f0f6fc" font-size="30" font-weight="700">Creative UI mode — inspiration with taste, then proof in the browser</text><text x="60" y="98" fill="#8b949e" font-size="16">For “premium”, “creative”, “use real references” and “don’t make it look AI-generated” requests.</text><path d="M95 310H1105" stroke="#30363d" stroke-width="4"/><path d="M95 310H1105" stroke="url(#accent)" stroke-width="3" opacity=".9"/><g><circle cx="120" cy="310" r="19" fill="#161b22" stroke="#58a6ff" stroke-width="3"/><circle cx="310" cy="310" r="19" fill="#161b22" stroke="#7dd3fc" stroke-width="3"/><circle cx="500" cy="310" r="19" fill="#161b22" stroke="#a78bfa" stroke-width="3"/><circle cx="690" cy="310" r="19" fill="#161b22" stroke="#c084fc" stroke-width="3"/><circle cx="880" cy="310" r="19" fill="#161b22" stroke="#f0abfc" stroke-width="3"/><circle cx="1070" cy="310" r="19" fill="#161b22" stroke="#f472b6" stroke-width="3"/></g><g text-anchor="middle"><text x="120" y="185" fill="#79c0ff" font-size="12">REFERENCES</text><text x="120" y="215" fill="#f0f6fc" font-size="18" font-weight="700">Inspo MCP</text><text x="120" y="240" fill="#8b949e" font-size="12">real interface research</text><text x="310" y="185" fill="#7dd3fc" font-size="12">DIRECTION</text><text x="310" y="215" fill="#f0f6fc" font-size="18" font-weight="700">Taste Skill</text><text x="310" y="240" fill="#8b949e" font-size="12">anti-slop visual judgment</text><text x="500" y="185" fill="#a78bfa" font-size="12">STYLE SYSTEM</text><text x="500" y="215" fill="#f0f6fc" font-size="18" font-weight="700">Awesome Design Skills</text><text x="500" y="240" fill="#8b949e" font-size="12">67-style design registry</text><text x="690" y="185" fill="#c084fc" font-size="12">DESIGN QUALITY</text><text x="690" y="215" fill="#f0f6fc" font-size="18" font-weight="700">UI UX Pro Max</text><text x="690" y="240" fill="#8b949e" font-size="12">layout • type • motion • polish</text><text x="880" y="185" fill="#f0abfc" font-size="12">IMPLEMENTATION</text><text x="880" y="215" fill="#f0f6fc" font-size="18" font-weight="700">Guidelines + shadcn</text><text x="880" y="240" fill="#8b949e" font-size="12">accessible production UI</text><text x="1070" y="185" fill="#f9a8d4" font-size="12">VERIFY</text><text x="1070" y="215" fill="#f0f6fc" font-size="18" font-weight="700">Playwright</text><text x="1070" y="240" fill="#8b949e" font-size="12">inspect what actually rendered</text></g><g text-anchor="middle"><text x="120" y="364" fill="#c9d1d9" font-size="12">macrostructure</text><text x="310" y="364" fill="#c9d1d9" font-size="12">visual direction</text><text x="500" y="364" fill="#c9d1d9" font-size="12">style vocabulary</text><text x="690" y="364" fill="#c9d1d9" font-size="12">hierarchy / spacing</text><text x="880" y="364" fill="#c9d1d9" font-size="12">components / code</text><text x="1070" y="364" fill="#c9d1d9" font-size="12">browser truth</text></g><rect x="125" y="420" width="950" height="78" rx="16" fill="#161b22" stroke="#30363d"/><text x="155" y="450" fill="#f0f6fc" font-size="16" font-weight="650">The goal is original synthesis, not website cloning.</text><text x="155" y="476" fill="#8b949e" font-size="12">References inform hierarchy, spacing, color roles, typography, components and motion. Accessibility, performance and independent QA still gate the result.</text></g></svg>