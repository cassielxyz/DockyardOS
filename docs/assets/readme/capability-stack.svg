<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">DockyardOS capability stack</title><desc id="desc">Curated skills, agents, MCPs, providers, security and verification capabilities selected per task.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#f0f6fc" font-size="30" font-weight="700">DockyardOS does not load every tool for every task</text><text x="60" y="98" fill="#8b949e" font-size="16">The selector chooses a bounded capability set using task, stack, phase, trust, risk, context cost and readiness.</text><g transform="translate(60 145)"><rect width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="20" y="29" fill="#79c0ff" font-size="12">PLANNING / REASONING</text><text x="20" y="58" fill="#f0f6fc" font-size="18" font-weight="700">Superpowers</text><text x="20" y="83" fill="#c9d1d9" font-size="12">architecture • planning • debugging</text><text x="20" y="105" fill="#8b949e" font-size="11">research / task decomposition / review</text><rect x="280" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="300" y="29" fill="#a78bfa" font-size="12">UI / EXPERIENCE</text><text x="300" y="58" fill="#f0f6fc" font-size="18" font-weight="700">Creative UI stack</text><text x="300" y="83" fill="#c9d1d9" font-size="12">Taste • Awesome Design • UI UX Pro Max</text><text x="300" y="105" fill="#8b949e" font-size="11">Inspo • shadcn • web guidelines</text><rect x="560" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="580" y="29" fill="#7ee787" font-size="12">BROWSER / VERIFICATION</text><text x="580" y="58" fill="#f0f6fc" font-size="18" font-weight="700">Playwright</text><text x="580" y="83" fill="#c9d1d9" font-size="12">inspect real rendered behavior</text><text x="580" y="105" fill="#8b949e" font-size="11">console • interaction • accessibility</text><rect x="840" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="860" y="29" fill="#f0abfc" font-size="12">SECURITY</text><text x="860" y="58" fill="#f0f6fc" font-size="18" font-weight="700">OWASP + scanners</text><text x="860" y="83" fill="#c9d1d9" font-size="12">Gitleaks • OSV • Semgrep • Strix</text><text x="860" y="105" fill="#8b949e" font-size="11">proof → fix → same-scope rerun</text><rect y="165" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="20" y="194" fill="#4cc9f0" font-size="12">RESEARCH / REACH</text><text x="20" y="223" fill="#f0f6fc" font-size="18" font-weight="700">Agent Reach</text><text x="20" y="248" fill="#c9d1d9" font-size="12">bounded external research signals</text><text x="20" y="270" fill="#8b949e" font-size="11">provenance-aware routing</text><rect x="280" y="165" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="300" y="194" fill="#79c0ff" font-size="12">MCP CONNECTORS</text><text x="300" y="223" fill="#f0f6fc" font-size="18" font-weight="700">Project systems</text><text x="300" y="248" fill="#c9d1d9" font-size="12">GitHub • Figma • Linear • Notion • Inspo</text><text x="300" y="270" fill="#8b949e" font-size="11">configured ≠ connected</text><rect x="560" y="165" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="580" y="194" fill="#7ee787" font-size="12">PROVIDERS</text><text x="580" y="223" fill="#f0f6fc" font-size="18" font-weight="700">Deploy / DB / cloud</text><text x="580" y="248" fill="#c9d1d9" font-size="12">Vercel • Cloudflare • Supabase • Neon</text><text x="580" y="270" fill="#8b949e" font-size="11">fallback chains + live readiness</text><rect x="840" y="165" width="250" height="130" rx="16" fill="#161b22" stroke="#30363d"/><text x="860" y="194" fill="#e3b341" font-size="12">REFACTOR / MAINTENANCE</text><text x="860" y="223" fill="#f0f6fc" font-size="18" font-weight="700">Safe Refactor</text><text x="860" y="248" fill="#c9d1d9" font-size="12">dead code • cleanup • tech debt</text><text x="860" y="270" fill="#8b949e" font-size="11">behavior-preservation + regression</text></g><rect x="145" y="492" width="910" height="58" rx="16" fill="#111827" stroke="#30363d"/><text x="600" y="517" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="650">Selection is not execution permission.</text><text x="600" y="539" text-anchor="middle" fill="#8b949e" font-size="11">Installed, connected, trusted, approved and runtime-ready are checked as separate states.</text></g></svg>