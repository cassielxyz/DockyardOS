<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">DockyardOS verification loop</title><desc id="desc">Safe implementation, testing, security, refactoring and checkpoint verification loop.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#101820"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#58a6ff"/></marker></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#f0f6fc" font-size="30" font-weight="700">The agent does not get to declare victory by itself</text><text x="60" y="98" fill="#8b949e" font-size="16">DockyardOS separates implementation from proof and preserves failures instead of converting them into “done”.</text><g transform="translate(85 160)"><rect width="210" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="20" y="30" fill="#79c0ff" font-size="12">IMPLEMENT</text><text x="20" y="61" fill="#f0f6fc" font-size="19" font-weight="700">Make the change</text><text x="20" y="85" fill="#8b949e" font-size="12">isolated writer / bounded scope</text><rect x="275" width="210" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="295" y="30" fill="#4cc9f0" font-size="12">VERIFY</text><text x="295" y="61" fill="#f0f6fc" font-size="19" font-weight="700">Run real checks</text><text x="295" y="85" fill="#8b949e" font-size="12">tests • build • browser • provider</text><rect x="550" width="210" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="570" y="30" fill="#a78bfa" font-size="12">SECURITY</text><text x="570" y="61" fill="#f0f6fc" font-size="19" font-weight="700">Scan the same scope</text><text x="570" y="85" fill="#8b949e" font-size="12">OWASP • Gitleaks • OSV • Semgrep</text><rect x="825" width="210" height="105" rx="16" fill="#161b22" stroke="#30363d"/><text x="845" y="30" fill="#7ee787" font-size="12">EVIDENCE</text><text x="845" y="61" fill="#f0f6fc" font-size="19" font-weight="700">Checkpoint truth</text><text x="845" y="85" fill="#8b949e" font-size="12">record proof / blockers / next step</text><path d="M210 122h142M485 122h142M760 122h142" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)" transform="translate(0 -70)"/><path d="M930 120v125H105c-40 0-55-30-55-60V150" stroke="#30363d" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="135" y="315" width="350" height="105" rx="16" fill="#111827" stroke="#30363d"/><text x="157" y="344" fill="#e3b341" font-size="12">SAFE REFACTOR / CLEANUP</text><text x="157" y="373" fill="#f0f6fc" font-size="18" font-weight="650">Dead code ≠ free delete permission</text><text x="157" y="398" fill="#8b949e" font-size="12">map behavior → refactor → regression test → reviewer</text><rect x="550" y="315" width="350" height="105" rx="16" fill="#111827" stroke="#30363d"/><text x="572" y="344" fill="#f85149" font-size="12">FAIL-CLOSED STATES</text><text x="572" y="373" fill="#f0f6fc" font-size="18" font-weight="650">Missing proof stays incomplete</text><text x="572" y="398" fill="#8b949e" font-size="12">missing scanner / failed build / unverified provider ≠ pass</text></g><rect x="310" y="500" width="580" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="600" y="520" text-anchor="middle" fill="#c9d1d9" font-size="12">Proof → fix → rerun → independent review → checkpoint</text></g></svg>