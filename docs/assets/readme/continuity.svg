<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">DockyardOS continuity</title><desc id="desc">A persistent external project brain shared across agent hosts and sessions.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#4cc9f0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="60" y="68" fill="#f0f6fc" font-size="30" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Persistent project memory — not fragile chat memory</text><text x="60" y="100" fill="#8b949e" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">DockyardOS stores the project state outside the model session so another host or a later login can continue from evidence.</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><circle cx="600" cy="310" r="118" fill="#111827" stroke="url(#ring)" stroke-width="3"/><circle cx="600" cy="310" r="92" fill="#161b22" stroke="#30363d"/><text x="600" y="280" text-anchor="middle" fill="#79c0ff" font-size="13">~/.dockyardos/projects</text><text x="600" y="316" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">PROJECT BRAIN</text><text x="600" y="345" text-anchor="middle" fill="#c9d1d9" font-size="13">checkpoint • phase • decisions</text><text x="600" y="368" text-anchor="middle" fill="#c9d1d9" font-size="13">blockers • artifacts • Git state</text><g fill="#161b22" stroke="#30363d"><rect x="90" y="180" width="190" height="78" rx="14"/><rect x="90" y="350" width="190" height="78" rx="14"/><rect x="920" y="180" width="190" height="78" rx="14"/><rect x="920" y="350" width="190" height="78" rx="14"/><rect x="330" y="430" width="190" height="78" rx="14"/><rect x="680" y="430" width="190" height="78" rx="14"/></g><g fill="#f0f6fc" font-size="17" font-weight="650"><text x="185" y="214" text-anchor="middle">Antigravity</text><text x="185" y="384" text-anchor="middle">Gemini CLI</text><text x="1015" y="214" text-anchor="middle">Codex</text><text x="1015" y="384" text-anchor="middle">Claude Code</text><text x="425" y="464" text-anchor="middle">Cursor</text><text x="775" y="464" text-anchor="middle">OpenCode</text></g><g fill="#8b949e" font-size="12"><text x="185" y="237" text-anchor="middle">richest native integration</text><text x="185" y="407" text-anchor="middle">portable + MCP</text><text x="1015" y="237" text-anchor="middle">portable + MCP</text><text x="1015" y="407" text-anchor="middle">portable + MCP</text><text x="425" y="487" text-anchor="middle">portable + MCP</text><text x="775" y="487" text-anchor="middle">portable + MCP</text></g><g stroke="#30363d" stroke-width="2" fill="none"><path d="M280 220C390 220 430 250 490 280"/><path d="M280 389C390 389 430 360 490 335"/><path d="M920 220C810 220 770 250 710 280"/><path d="M920 389C810 389 770 360 710 335"/><path d="M520 468C555 430 570 410 580 400"/><path d="M680 468C645 430 630 410 620 400"/></g><rect x="350" y="135" width="500" height="42" rx="11" fill="#161b22" stroke="#30363d"/><text x="600" y="161" text-anchor="middle" fill="#c9d1d9" font-size="13">Credits end / app closes / account changes → reopen → say “continue” → restore project state</text><rect x="340" y="520" width="520" height="24" rx="12" fill="#111827"/><text x="600" y="537" text-anchor="middle" fill="#8b949e" font-size="11">This is durable project context, not a claim to preserve hidden model thoughts or every chat token.</text></g></svg>