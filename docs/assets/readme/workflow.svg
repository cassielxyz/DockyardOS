<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">DockyardOS workflow</title><desc id="desc">DockyardOS phase-aware workflow from discovery to release.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff"/><stop offset=".45" stop-color="#4cc9f0"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs><rect width="1200" height="470" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#f0f6fc" font-size="30" font-weight="700">One request → the right workflow → evidence at every gate</text><text x="60" y="98" fill="#8b949e" font-size="16">DockyardOS activates only the roles and capabilities needed for the current phase instead of loading everything at once.</text><rect x="75" y="180" width="1050" height="8" rx="4" fill="#21262d"/><rect x="75" y="180" width="1050" height="8" rx="4" fill="url(#rail)" opacity=".95"/><g><circle cx="90" cy="184" r="17" fill="#161b22" stroke="#58a6ff" stroke-width="3"/><circle cx="250" cy="184" r="17" fill="#161b22" stroke="#58a6ff" stroke-width="3"/><circle cx="410" cy="184" r="17" fill="#161b22" stroke="#4cc9f0" stroke-width="3"/><circle cx="570" cy="184" r="17" fill="#161b22" stroke="#4cc9f0" stroke-width="3"/><circle cx="730" cy="184" r="17" fill="#161b22" stroke="#a78bfa" stroke-width="3"/><circle cx="890" cy="184" r="17" fill="#161b22" stroke="#a78bfa" stroke-width="3"/><circle cx="1050" cy="184" r="17" fill="#161b22" stroke="#3fb950" stroke-width="3"/></g><g text-anchor="middle"><text x="90" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Discovery</text><text x="250" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Architecture</text><text x="410" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Planning</text><text x="570" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Implementation</text><text x="730" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Verification</text><text x="890" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Security</text><text x="1050" y="235" fill="#f0f6fc" font-size="15" font-weight="650">Release</text><text x="90" y="258" fill="#8b949e" font-size="11">inspect reality</text><text x="250" y="258" fill="#8b949e" font-size="11">choose shape</text><text x="410" y="258" fill="#8b949e" font-size="11">scope tasks</text><text x="570" y="258" fill="#8b949e" font-size="11">isolated writers</text><text x="730" y="258" fill="#8b949e" font-size="11">tests / browser</text><text x="890" y="258" fill="#8b949e" font-size="11">OWASP / scanners</text><text x="1050" y="258" fill="#8b949e" font-size="11">gated shipping</text></g><g transform="translate(80 315)"><rect width="310" height="90" rx="14" fill="#161b22" stroke="#30363d"/><text x="20" y="28" fill="#79c0ff" font-size="12">TEAM COMPOSER</text><text x="20" y="54" fill="#f0f6fc" font-size="17" font-weight="650">Specialists appear when useful</text><text x="20" y="75" fill="#8b949e" font-size="12">architect • implementation • QA • security • release</text><rect x="365" width="310" height="90" rx="14" fill="#161b22" stroke="#30363d"/><text x="385" y="28" fill="#a78bfa" font-size="12">CONTEXT BUDGET</text><text x="385" y="54" fill="#f0f6fc" font-size="17" font-weight="650">Compact handoffs, not transcript replay</text><text x="385" y="75" fill="#8b949e" font-size="12">decisions • blockers • outputs • required gates</text><rect x="730" width="310" height="90" rx="14" fill="#161b22" stroke="#30363d"/><text x="750" y="28" fill="#7ee787" font-size="12">CHECKPOINT</text><text x="750" y="54" fill="#f0f6fc" font-size="17" font-weight="650">Resume from verified progress</text><text x="750" y="75" fill="#8b949e" font-size="12">phase state • artifacts • Git evidence • next action</text></g></g></svg>