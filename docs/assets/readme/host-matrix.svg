<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">DockyardOS host matrix</title><desc id="desc">Shared DockyardOS state across Antigravity, Gemini CLI, Codex, Claude Code, Cursor, OpenCode and VS Code.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#f0f6fc" font-size="30" font-weight="700">One project state. Multiple agent hosts.</text><text x="60" y="98" fill="#8b949e" font-size="16">Dockyard adapts to each host’s real integration surface instead of pretending every host exposes identical hooks.</text><g transform="translate(80 150)"><rect width="1040" height="245" rx="18" fill="#0f141b" stroke="#30363d"/><g fill="#161b22" stroke="#30363d"><rect x="25" y="35" width="135" height="72" rx="13"/><rect x="175" y="35" width="135" height="72" rx="13"/><rect x="325" y="35" width="135" height="72" rx="13"/><rect x="475" y="35" width="135" height="72" rx="13"/><rect x="625" y="35" width="135" height="72" rx="13"/><rect x="775" y="35" width="135" height="72" rx="13"/><rect x="925" y="35" width="90" height="72" rx="13"/></g><g text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="650"><text x="92" y="67">Antigravity</text><text x="242" y="67">Gemini CLI</text><text x="392" y="67">Codex</text><text x="542" y="67">Claude</text><text x="692" y="67">Cursor</text><text x="842" y="67">OpenCode</text><text x="970" y="67">VS Code</text></g><g text-anchor="middle" fill="#8b949e" font-size="10"><text x="92" y="88">full plugin + hooks</text><text x="242" y="88">skill + MCP</text><text x="392" y="88">plugin + MCP</text><text x="542" y="88">skill + MCP</text><text x="692" y="88">skill + MCP</text><text x="842" y="88">skill + MCP</text><text x="970" y="88">control UI</text></g><path d="M92 108v52M242 108v52M392 108v52M542 108v52M692 108v52M842 108v52M970 108v52" stroke="#30363d" stroke-width="2"/><rect x="195" y="160" width="650" height="55" rx="14" fill="#161b22" stroke="#58a6ff"/><text x="520" y="187" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">Shared DockyardOS project / team / checkpoint state</text><text x="520" y="205" text-anchor="middle" fill="#8b949e" font-size="10">external to the source repo and external to one model conversation</text></g><rect x="215" y="430" width="770" height="42" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="242" cy="451" r="6" fill="#3fb950"/><text x="262" y="456" fill="#c9d1d9" font-size="12">Verified six-host compatibility checkpoint exists; host-specific capabilities still remain truthful and distinct.</text></g></svg>